[project]
name = "llm-token-lens"
version = "0.2.0"
description = "Local LLM token efficiency middleware — zero cloud, zero tracking, coaches developers on token waste in the terminal"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
accurate-counting = ["tiktoken>=0.7"]
langgraph = ["langchain-core>=0.2"]
dev = ["pytest>=8", "pytest-cov", "tiktoken", "openai>=1.0.0"]
demo = ["streamlit>=1.30"]

[project.urls]
Homepage = "https://github.com/nikhil8725/TokenLens"
Issues = "https://github.com/nikhil8725/TokenLens/issues"

[tool.hatch.build.targets.wheel]
packages = ["token_lens"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["token_lens/tests"]
